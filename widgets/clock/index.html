<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Reloj · Academic OS</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="clock.css">
</head>
<body>
  <main class="aos-widget clock" data-layout="auto">
    <svg class="clock__face" viewBox="-50 -50 100 100" role="img" aria-label="Reloj analógico">
      <g class="clock__ticks"></g>
      <line class="clock__hand clock__hand--hour"   x1="0" y1="5"  x2="0" y2="-23"/>
      <line class="clock__hand clock__hand--minute" x1="0" y1="6"  x2="0" y2="-34"/>
      <line class="clock__hand clock__hand--second" x1="0" y1="10" x2="0" y2="-39"/>
      <circle class="clock__pin" r="2.4"/>
    </svg>
    <div class="clock__text">
      <div class="clock__time aos-tabular" aria-live="off">--:--</div>
      <div class="clock__date"></div>
    </div>
  </main>
  <noscript>Este widget necesita JavaScript.</noscript>
  <script type="module" src="clock.js"></script>
</body>
</html>
