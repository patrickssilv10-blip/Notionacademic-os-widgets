<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Progreso del tiempo · Academic OS</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="time-progress.css">
</head>
<body>
  <main class="aos-widget tp" data-layout="lines" aria-label="Progreso del tiempo">
    <ul class="tp__list">
      <li class="tp__item" data-period="day">
        <div class="tp__head" aria-hidden="true">
          <span class="tp__label">Día</span>
          <span class="tp__detail"></span>
          <span class="tp__left"></span>
          <span class="tp__pct aos-tabular">–</span>
        </div>
        <div class="tp__bar" role="progressbar" aria-label="Día" aria-valuemin="0" aria-valuemax="100"><span class="tp__fill"></span></div>
      </li>
      <li class="tp__item" data-period="week">
        <div class="tp__head" aria-hidden="true">
          <span class="tp__label">Semana</span>
          <span class="tp__detail"></span>
          <span class="tp__left"></span>
          <span class="tp__pct aos-tabular">–</span>
        </div>
        <div class="tp__bar" role="progressbar" aria-label="Semana" aria-valuemin="0" aria-valuemax="100"><span class="tp__fill"></span></div>
      </li>
      <li class="tp__item" data-period="month">
        <div class="tp__head" aria-hidden="true">
          <span class="tp__label">Mes</span>
          <span class="tp__detail"></span>
          <span class="tp__left"></span>
          <span class="tp__pct aos-tabular">–</span>
        </div>
        <div class="tp__bar" role="progressbar" aria-label="Mes" aria-valuemin="0" aria-valuemax="100"><span class="tp__fill"></span></div>
      </li>
      <li class="tp__item" data-period="year">
        <div class="tp__head" aria-hidden="true">
          <span class="tp__label">Año</span>
          <span class="tp__detail"></span>
          <span class="tp__left"></span>
          <span class="tp__pct aos-tabular">–</span>
        </div>
        <div class="tp__bar" role="progressbar" aria-label="Año" aria-valuemin="0" aria-valuemax="100"><span class="tp__fill"></span></div>
      </li>
    </ul>
  </main>
  <noscript>Este widget necesita JavaScript.</noscript>
  <script type="module" src="time-progress.js"></script>
</body>
</html>
